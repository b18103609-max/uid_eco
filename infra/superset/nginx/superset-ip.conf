limit_req_zone $binary_remote_addr zone=guest_token:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 94.125.100.176;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 94.125.100.176;

    ssl_certificate /etc/letsencrypt/live/94.125.100.176/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94.125.100.176/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://b18103609-max.github.io http://localhost:4173 http://localhost:5173" always;

    client_max_body_size 32m;

    location = /api/guest-token {
        limit_req zone=guest_token burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090/api/guest-token$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
