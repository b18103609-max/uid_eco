services:
  metadata-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - superset-metadata:/var/lib/postgresql/data
    networks:
      - bi-internal

  analytics-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uid_analytics
      POSTGRES_USER: uid_analytics
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uid_analytics -d uid_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - uid-analytics:/var/lib/postgresql/data
    networks:
      - bi-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - superset-redis:/data
    networks:
      - bi-internal

  superset-init:
    build: .
    restart: "no"
    env_file: .env
    environment: &superset-environment
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
      SUPERSET_PUBLIC_ORIGIN: ${SUPERSET_PUBLIC_ORIGIN:-http://localhost:8088}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USERNAME}" \
          --firstname UID \
          --lastname Admin \
          --email "$${SUPERSET_ADMIN_EMAIL}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
    networks:
      - bi-internal

  superset:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *superset-environment
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    command: gunicorn --bind 0.0.0.0:8088 --workers 2 --worker-class gthread --threads 4 --timeout 120 "superset.app:create_app()"
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - bi-internal

  guest-token:
    build: ./guest-token
    restart: unless-stopped
    environment:
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
      GUEST_TOKEN_JWT_AUDIENCE: superset
      GUEST_TOKEN_LIFETIME_SECONDS: 300
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - bi-internal

volumes:
  superset-metadata:
  uid-analytics:
  superset-redis:

networks:
  bi-internal:
    driver: bridge
